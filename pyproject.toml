[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jira-enhancer"
version = "0.1.0"
description = "Governance-aware Jira enrichment and RL-guided epic-to-story decomposition"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}
authors = [
  {name = "Manish Kumar Agrawal"},
  {name = "Sandeep Kumar"},
  {name = "Ashok Shukla"},
  {name = "Subham Kumar"},
  {name = "Abhishek Gupta"},
  {name = "Nandagopal Srinivasan"}
]

[project.optional-dependencies]
reviewer = [
  "Pillow>=10.0",
  "matplotlib>=3.7",
  "numpy>=1.24",
  "openpyxl>=3.1",
  "pandas>=2.0",
  "scipy>=1.10",
]
benchmark = [
  "datasets>=2.18",
  "pyarrow>=14.0",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"jira_enhancer.data" = ["*.json"]
